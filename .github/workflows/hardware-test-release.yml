name: Publish Hardware Test Release

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Mobile/BDFR_FaceCapture_Android/**'
      - 'CMakeLists.txt'
      - '.github/workflows/hardware-test-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-kit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows hardware test kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/BDFR_Windows_Hardware_Test_Kit | Out-Null
          Copy-Item build/Release/bdfr_cli.exe dist/BDFR_Windows_Hardware_Test_Kit/
          Copy-Item build/Release/bdfr_initial_smoke_tests.exe dist/BDFR_Windows_Hardware_Test_Kit/
          Copy-Item build/Release/bdfr_live_receiver.exe dist/BDFR_Windows_Hardware_Test_Kit/
          Copy-Item scripts/run_prebuilt_test.ps1 dist/BDFR_Windows_Hardware_Test_Kit/
          Copy-Item scripts/run_hardware_receiver.ps1 dist/BDFR_Windows_Hardware_Test_Kit/
          Copy-Item Docs/PREBUILT_TEST.md dist/BDFR_Windows_Hardware_Test_Kit/README.md
          Copy-Item Docs/HARDWARE_LIVE_TEST.md dist/BDFR_Windows_Hardware_Test_Kit/HARDWARE_TEST.md
          Compress-Archive -Path dist/BDFR_Windows_Hardware_Test_Kit/* -DestinationPath dist/BDFR_Windows_Hardware_Test_Kit.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hardware-test-windows
          path: dist/BDFR_Windows_Hardware_Test_Kit.zip
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37.0 preview
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Android unit tests
        working-directory: Mobile/BDFR_FaceCapture_Android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Android debug APK
        working-directory: Mobile/BDFR_FaceCapture_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp Mobile/BDFR_FaceCapture_Android/app/build/outputs/apk/debug/app-debug.apk dist/BDFR_Android_Hardware_Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hardware-test-android
          path: dist/BDFR_Android_Hardware_Test.apk
          if-no-files-found: error

  publish:
    needs: [windows-kit, android-apk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: hardware-test-windows
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: hardware-test-android
          path: release-assets

      - name: Move latest hardware-test tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f hardware-test-latest "$GITHUB_SHA"
          git push origin refs/tags/hardware-test-latest --force

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view hardware-test-latest >/dev/null 2>&1; then
            gh release create hardware-test-latest --title "BDFR Hardware Test — Latest" --notes "Latest test-ready Windows kit and Android APK for BDFR Facial Animation hardware integration. These assets are rebuilt from the current main branch after tests pass." --prerelease
          fi
          gh release upload hardware-test-latest release-assets/BDFR_Windows_Hardware_Test_Kit.zip release-assets/BDFR_Android_Hardware_Test.apk --clobber
