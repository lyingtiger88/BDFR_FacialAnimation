name: BDFR Studio CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/BDFRStudio/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/BDFRStudio/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:

jobs:
  windows-studio:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-studio -DBDFR_BUILD_STUDIO=ON

      - name: Build Studio
        shell: pwsh
        run: cmake --build build-studio --config Release --target BDFRStudio

      - name: Run Core Tests
        shell: pwsh
        run: ctest --test-dir build-studio -C Release --output-on-failure

      - name: Package Studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/BDFR_Studio_Windows | Out-Null
          $exe = "build-studio/apps/BDFRStudio/Release/BDFR Studio.exe"
          if (-not (Test-Path $exe)) {
            throw "BDFR Studio executable not found: $exe"
          }
          Copy-Item $exe dist/BDFR_Studio_Windows/
          windeployqt --release --no-translations --compiler-runtime "dist/BDFR_Studio_Windows/BDFR Studio.exe"
          Compress-Archive -Path dist/BDFR_Studio_Windows/* -DestinationPath dist/BDFR_Studio_Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR_Studio_Windows
          path: dist/BDFR_Studio_Windows.zip
          if-no-files-found: error
